name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.21.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/check-published-spec.mjs
      - name: Tag matches package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Stage unless this version is already on npm
        run: |
          spec="$(node -p "const p = require('./package.json'); p.name + '@' + p.version")"
          if [ -n "$(npm view "$spec" version 2>/dev/null)" ]; then
            echo "$spec is already on npm, skipping staging"
          else
            npm stage publish --access public
          fi
